# Signs in with the dev button, sees the empty library, signs out. Run with `npm run e2e`.
appId: com.ant1007.recipeapp
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible: "Sign in with Apple"
- assertVisible: "Sign in with Google"
- tapOn: "Sign in as test user (dev)"
- extendedWaitUntil:
    visible: "No recipes yet"
    timeout: 15000
- assertVisible: "Library"
- runFlow: subflows/sign-out.yaml
