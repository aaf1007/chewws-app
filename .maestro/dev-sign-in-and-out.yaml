# Signs in with the dev button, sees the empty Library and the tabs, signs out. Run with `npm run e2e`.
appId: com.ant1007.recipeapp
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible: "Sign in with Apple"
- assertVisible: "Sign in with Google"
- tapOn: "Sign in as test user (dev)"
- extendedWaitUntil:
    visible: "No recipes yet"
    timeout: 15000
- assertVisible: "Library"
- assertVisible:
    id: "tab-pantry"
- assertVisible:
    id: "tab-shopping-list"
- runFlow: subflows/sign-out.yaml
