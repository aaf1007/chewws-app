# Starts the app fresh and signs in as the seeded dev user. Ends on the empty Library.
#   - runFlow: subflows/sign-in-dev.yaml
appId: com.ant1007.recipeapp
---
- runFlow: launch-fresh.yaml
- tapOn: "Sign in as test user (dev)"
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- waitForAnimationToEnd
